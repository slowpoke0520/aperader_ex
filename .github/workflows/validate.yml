name: Validate Windows build

on:
  push:
    branches:
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run release tests
        shell: pwsh
        run: dotnet test ApeRadar_EX/ApeRadar_Src/ApeRadar.sln -c Release
