name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build update package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\Publish-Release.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, 'artifacts/ApeRadar-win-x64.zip', '--generate-notes', '--verify-tag')
          if ($version -match '-(?:dev|alpha|beta|rc)\.\d+$') {
            $arguments += '--prerelease'
          }
          gh @arguments
